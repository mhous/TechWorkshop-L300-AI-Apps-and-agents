name: Build and Push to Azure Container Registry

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Docker Login to ACR
        run: |
          set -e
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Create .env file
        env:
          ENV_FILE: ${{ secrets.ENV }}
        run: |
          set -e
          (umask 077; echo "$ENV_FILE" > .env)

      - name: Build and Push Docker image
        env:
          AZURE_REGISTRY_NAME: ${{ secrets.ACR_NAME }}
          IMAGE_NAME: ${{ github.event.repository.name }}
        run: |
          set -e
          docker build -t $AZURE_REGISTRY_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} .
          docker push $AZURE_REGISTRY_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

      - name: Clean up .env file
        if: always()
        run: rm -f .env

      - name: Azure logout
        if: always()
        run: az logout || true
